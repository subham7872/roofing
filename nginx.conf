# Nginx Configuration for Hostinger VPS
# Place this in /etc/nginx/sites-available/roofing (or your domain name)
# Then create symlink: sudo ln -s /etc/nginx/sites-available/roofing /etc/nginx/sites-enabled/

upstream nextjs_frontend {
    server localhost:3000;
    keepalive 64;
}

upstream express_backend {
    server localhost:8088;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # Replace with your actual domain
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;
    
    # For now, allow HTTP (comment out after SSL setup)
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# API Backend Proxy
server {
    listen 80;
    server_name api.your-domain.com;  # Replace with your API subdomain or use /api path
    
    # If using subdomain for API:
    location / {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

